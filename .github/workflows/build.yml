name: Build

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERBOSE: 1
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfltk1.3-dev fluid gettext appstream \
            libpixman-1-dev libjpeg-turbo8-dev \
            libgnutls28-dev nettle-dev libgmp-dev \
            libxtst-dev libxdamage-dev libxfixes-dev libxrandr-dev \
            libpam-dev libsystemd-dev libpwquality-dev \
            libavcodec-dev libavutil-dev libswscale-dev \
            libpulse-dev \
            uuid-dev libglib2.0-dev libpipewire-0.3-dev \
            libwayland-dev libxkbcommon-dev \
            libgtest-dev
      - name: Configure
        run: |
          cmake \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_NLS=ON \
            -DENABLE_H264=ON \
            -DENABLE_AUDIO=ON \
            -DENABLE_GNUTLS=ON \
            -DENABLE_NETTLE=ON \
            -DENABLE_PAM=ON \
            -DBUILD_VIEWER=ON \
            -DENABLE_SYSTEMD=ON \
            -DENABLE_PWQUALITY=ON \
            -DENABLE_WAYLAND=ON \
            -S . -B build
      - name: Build
        working-directory: build
        run: make
      - name: Install
        working-directory: build
        run: make tarball
      - uses: actions/upload-artifact@v7
        with:
          name: Linux (Ubuntu)
          path: build/tigervnc-*.tar.gz
      - name: Test
        continue-on-error: true
        working-directory: build
        run: ctest --test-dir tests/unit/ --output-junit test-results.xml
      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux
          path: build/tests/unit/test-results.xml

  report-linux:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    needs: build-linux
    if: always()
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: test-results-linux
      - uses: dorny/test-reporter@v3
        with:
          artifact: test-results-linux
          name: FIXME not used, but required
          path: '*.xml'
          reporter: java-junit

  build-all-disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERBOSE: 1
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfltk1.3-dev fluid \
            libpixman-1-dev libjpeg-turbo8-dev \
            libxtst-dev libxdamage-dev libxfixes-dev libxrandr-dev \
            uuid-dev libglib2.0-dev libpipewire-0.3-dev \
            libwayland-dev libxkbcommon-dev \
            libgtest-dev
      - name: Configure
        run: |
          cmake \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_NLS=OFF \
            -DENABLE_H264=OFF \
            -DENABLE_AUDIO=OFF \
            -DBUILD_VIEWER=ON \
            -DENABLE_GNUTLS=OFF \
            -DENABLE_NETTLE=OFF \
            -DENABLE_PAM=OFF \
            -DENABLE_SELINUX=OFF \
            -DENABLE_SYSTEMD=OFF \
            -DENABLE_PWQUALITY=OFF \
            -DENABLE_WAYLAND=ON \
            -S . -B build
      - name: Build
        working-directory: build
        run: make
      - name: Install
        working-directory: build
        run: make tarball
      - uses: actions/upload-artifact@v7
        with:
          name: Linux (Ubuntu, everything disabled)
          path: build/tigervnc-*.tar.gz
      - name: Test
        continue-on-error: true
        working-directory: build
        run: ctest --test-dir tests/unit/ --output-junit test-results.xml
      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-all-disabled
          path: build/tests/unit/test-results.xml

  report-all-disabled:
    name: Unit tests (Linux, everything disabled)
    runs-on: ubuntu-latest
    needs: build-all-disabled
    if: always()
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: test-results-all-disabled
      - uses: dorny/test-reporter@v3
        with:
          artifact: test-results-all-disabled
          name: FIXME not used, but required
          path: '*.xml'
          reporter: java-junit

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VERBOSE: 1
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
      - name: Install dependencies
        run: |
          pacman --sync --noconfirm --needed \
            make mingw-w64-ucrt-x86_64-toolchain \
            mingw-w64-ucrt-x86_64-cmake
          pacman --sync --noconfirm --needed \
            mingw-w64-ucrt-x86_64-fltk1.3 \
            mingw-w64-ucrt-x86_64-libjpeg-turbo \
            mingw-w64-ucrt-x86_64-gnutls \
            mingw-w64-ucrt-x86_64-pixman \
            mingw-w64-ucrt-x86_64-nettle \
            mingw-w64-ucrt-x86_64-gmp \
            mingw-w64-ucrt-x86_64-gtest
      - name: Configure
        run: |
          cmake \
            -G "MSYS Makefiles" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_NLS=ON \
            -DENABLE_H264=ON \
            -DENABLE_AUDIO=ON \
            -DENABLE_GNUTLS=ON \
            -DENABLE_NETTLE=ON \
            -DBUILD_VIEWER=ON \
            -S . -B build
      - name: Build
        working-directory: build
        run: make
      - name: Install
        working-directory: build
        env:
          MSYS2_PATH_TYPE: inherit
        run: make installer winvnc_installer
      - uses: actions/upload-artifact@v7
        with:
          name: Windows
          path: build/release/tigervnc*.exe
      - name: Test
        continue-on-error: true
        working-directory: build
        run: ctest --test-dir tests/unit/ --output-junit test-results.xml
      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: build/tests/unit/test-results.xml

  report-windows:
    name: Unit tests (Windows)
    runs-on: ubuntu-latest
    needs: build-windows
    if: always()
    steps:
      - uses: dorny/test-reporter@v3
        with:
          artifact: test-results-windows
          name: FIXME not used, but required
          path: '*.xml'
          reporter: java-junit

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      VERBOSE: 1
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          brew install \
            fltk@1.3 pixman ffmpeg \
            gnutls nettle gmp \
            googletest
          brew link fltk@1.3
      - name: Configure
        run: |
          cmake \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_NLS=ON \
            -DENABLE_H264=ON \
            -DENABLE_GNUTLS=ON \
            -DENABLE_NETTLE=ON \
            -DBUILD_VIEWER=ON \
            -S . -B build
      - name: Build
        working-directory: build
        run: make
      - name: Install
        working-directory: build
        run: make dmg
      - uses: actions/upload-artifact@v7
        with:
          name: macOS
          path: build/release/TigerVNC-*.dmg
      - name: Test
        continue-on-error: true
        working-directory: build
        run: ctest --test-dir tests/unit/ --output-junit test-results.xml
      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-macos
          path: build/tests/unit/test-results.xml

  report-macos:
    name: Unit tests (macOS)
    runs-on: ubuntu-latest
    needs: build-macos
    if: always()
    steps:
      - uses: dorny/test-reporter@v3
        with:
          artifact: test-results-macos
          name: FIXME not used, but required
          path: '*.xml'
          reporter: java-junit

  build-java:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERBOSE: 1
    strategy:
      matrix:
        java: [ '8', '11', '17', '21' ]
    steps:
      - uses: actions/checkout@v6
      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - name: Configure
        working-directory: java
        run: cmake -DCMAKE_BUILD_TYPE=Debug -S . -B build
      - name: Build
        working-directory: java/build
        run: make
      - uses: actions/upload-artifact@v7
        with:
          name: Java (${{ matrix.java }})
          path: java/build/VncViewer.jar

  build-packages:
    timeout-minutes: 20
    strategy:
      matrix:
        target:
          - rocky8
          - rocky9
          - rocky10
          - jammy
          - noble
          - resolute
      fail-fast: false
    runs-on: ubuntu-latest
    env:
      DOCKER: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t tigervnc/$DOCKER .github/containers/$DOCKER
      - name: Build packages
        run: .github/containers/$DOCKER/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Packages (${{ matrix.target }})
          path: .github/containers/${{ matrix.target }}/result

  # Fork only: self-contained builds to hand out (the builds above are
  # developer builds that rely on the libraries of the build machine).
  # Windows: a folder with the viewer and its DLLs, zipped.
  dist-windows:
    if: startsWith(github.ref, 'refs/tags/wws-') || github.ref == 'refs/heads/file-drop'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
      - name: Install dependencies
        run: |
          pacman --sync --noconfirm --needed \
            make zip mingw-w64-ucrt-x86_64-toolchain \
            mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-fltk1.3 \
            mingw-w64-ucrt-x86_64-libjpeg-turbo \
            mingw-w64-ucrt-x86_64-gnutls \
            mingw-w64-ucrt-x86_64-pixman \
            mingw-w64-ucrt-x86_64-nettle \
            mingw-w64-ucrt-x86_64-gmp
      - name: Configure
        run: |
          cmake -G "MSYS Makefiles" -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_NLS=ON -DENABLE_GNUTLS=ON -DENABLE_NETTLE=ON \
            -DBUILD_VIEWER=ON -S . -B build
      - name: Build
        run: make -C build vncviewer translations
      - name: Collect
        run: |
          d=dist/TigerVNC-Dateiuebergabe
          mkdir -p $d
          cp build/vncviewer/vncviewer.exe LICENCE.TXT README.rst $d/
          for mo in build/po/*.mo; do
            lang=$(basename $mo .mo)
            mkdir -p $d/locale/$lang/LC_MESSAGES
            cp $mo $d/locale/$lang/LC_MESSAGES/tigervnc.mo
          done
          # every DLL from MSYS2, recursively
          ldd $d/vncviewer.exe | awk '$3 ~ /ucrt64/ {print $3}' | sort -u |
            xargs -r -I{} cp {} $d/
          # nothing may be left outside the folder and Windows
          (cd $d && PATH=/c/Windows/System32:/c/Windows /usr/bin/ldd vncviewer.exe) |
            tee ldd.txt
          if grep -v -i '/c/Windows' ldd.txt | grep -v '/dist/' | grep -q .; then
            echo "libraries outside the folder:"; exit 1
          fi
          if grep -q "not found" ldd.txt; then exit 1; fi
          (cd dist && zip -qr TigerVNC-Dateiuebergabe-Windows.zip TigerVNC-Dateiuebergabe)
      - name: Installer
        run: |
          cd .github/dist
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" -Q \
            "-DAppVersion=$GITHUB_REF_NAME" "-DBuild=$GITHUB_RUN_NUMBER" \
            "-DSourceDir=$(cygpath -w "$GITHUB_WORKSPACE/dist/TigerVNC-Dateiuebergabe")" \
            tigervnc-dateiuebergabe.iss
          mv TigerVNC-Dateiuebergabe-Windows-Setup.exe "$GITHUB_WORKSPACE/dist/"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: |
            dist/TigerVNC-Dateiuebergabe-Windows.zip
            dist/TigerVNC-Dateiuebergabe-Windows-Setup.exe

  # macOS: the app with the Homebrew libraries copied into it
  dist-macos:
    if: startsWith(github.ref, 'refs/tags/wws-') || github.ref == 'refs/heads/file-drop'
    runs-on: macos-14
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          brew install fltk@1.3 pixman gnutls nettle gmp gettext dylibbundler
          brew link fltk@1.3
      - name: Configure
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -DENABLE_NLS=ON \
            -DENABLE_GNUTLS=ON -DENABLE_NETTLE=ON -DENABLE_H264=OFF \
            -DBUILD_VIEWER=ON -S . -B build
      - name: Build
        run: make -C build vncviewer translations
      - name: Bundle
        run: |
          test -x build/vncviewer/vncviewer
          app=dist/TigerVNC.app
          mkdir -p $app/Contents/MacOS $app/Contents/Resources
          cp build/vncviewer/vncviewer $app/Contents/MacOS/
          # the WWS icon (.github/dist/wws-vnc.svg), under the name
          # Info.plist expects
          set=wws-vnc.iconset
          mkdir $set
          for s in 16 32 128 256 512; do
            sips -z $s $s .github/dist/wws-vnc-1024.png --out $set/icon_${s}x${s}.png
            sips -z $((s*2)) $((s*2)) .github/dist/wws-vnc-1024.png --out $set/icon_${s}x${s}@2x.png
          done
          iconutil -c icns $set -o $app/Contents/Resources/tigervnc.icns
          cp build/release/Info.plist $app/Contents/
          for mo in build/po/*.mo; do
            test -f "$mo" || continue
            lang=$(basename $mo .mo)
            mkdir -p $app/Contents/Resources/locale/$lang/LC_MESSAGES
            cp $mo $app/Contents/Resources/locale/$lang/LC_MESSAGES/tigervnc.mo
          done
          dylibbundler -od -b -x $app/Contents/MacOS/vncviewer \
            -d $app/Contents/Frameworks -p @executable_path/../Frameworks/
          codesign --force --deep --sign - $app
          # nothing may point into Homebrew any more
          if otool -L $app/Contents/MacOS/vncviewer $app/Contents/Frameworks/* |
              grep -E '/opt/homebrew|/usr/local/(opt|Cellar)'; then
            exit 1
          fi
          cp LICENCE.TXT README.rst dist/
          hdiutil create -fs HFS+ -volname TigerVNC-Dateiuebergabe \
            -srcfolder dist TigerVNC-Dateiuebergabe-macOS.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: TigerVNC-Dateiuebergabe-macOS.dmg

  # Fork only: a tag wws-* publishes the self-contained Windows and macOS
  # builds as a release (downloads for ps.schlaile.de/tigervnc/download/)
  release:
    if: startsWith(github.ref, 'refs/tags/wws-')
    needs: [dist-windows, dist-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-windows
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: dist-macos
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "TigerVNC with file drop (VNC File Drop), build $GITHUB_SHA. Unsigned test build, not an official TigerVNC release."
